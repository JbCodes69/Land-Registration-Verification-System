<div
  id="login-page-wrapper"
  class="relative min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center px-8 py-12"
  style="background-image: url('assets/bga.jpg');"
>
  <div id="login-page-container" class="relative z-10 w-full max-w-5xl rounded-[32px] overflow-hidden bg-white/10 backdrop-blur-xs border border-white/20 shadow-2xl">
    <div
      id="login-page-grid"
      class="grid grid-cols-1 md:grid-cols-2 min-h-[700px] shadow-sm"
    >
      <!-- Left Section -->
      <div
        id="login-left-panel"
        class="relative flex flex-col justify-between p-6 md:p-8 bg-black/70 overflow-hidden"
>

        <!-- Logo -->
        <div class="relative z-10">
          <h1 class="text-[#3aded7] text-3xl md:text-4xl font-light">
            The <span class="font-semibold">{{ abbrev }}</span>
          </h1>
        </div>

        <!-- Main text -->
        <div class="relative z-10">
          <h2 class="text-[#3aded7] text-5xl md:text-7xl font-light leading-[0.95] max-w-md">
            {{ loginWelcomeTitle }}
          </h2>
        </div>

        <!-- Bottom badge -->
        <div class="relative z-10 flex justify-end">
          <div class="w-16 h-16 rounded-2xl bg-[#2d2d2d] flex items-center justify-center shadow-lg">
            <span class="text-white text-2xl font-bold">LC.</span>
          </div>
        </div>
      </div>

      <!-- Right Section -->
      <div
        id="login-right-panel"
        class="bg-white/60 flex flex-col justify-between p-8 md:p-10"
>
        <div>
          <h2 class="text-4xl md:text-5xl font-serif text-[#1f1f1f] mb-3">
            Sign In
          </h2>

          <p class="text-sm text-gray-600 max-w-md leading-relaxed mb-10">
            {{ loginDescription }}
          </p>

          <!-- Success / error message -->
          <p
            *ngIf="message"
            class="mb-4 rounded-md px-4 py-3 text-sm"
            [ngClass]="messageType === 'success'
              ? 'bg-green-100 text-green-800'
              : 'bg-red-100 text-red-800'"
          >
            {{ message }}
          </p>

          <form class="space-y-8" (submit)="login($event)">
            <!-- Email -->
            <div>
              <label for="loginEmail" class="block text-sm text-gray-700 mb-2">
                Enter your email *
              </label>
              <input
                id="loginEmail"
                name="loginEmail"
                type="email"
                [(ngModel)]="email"
                class="w-full bg-transparent border-0 border-b border-gray-500 focus:outline-none focus:border-black pb-2 text-base"
              />
            </div>

            <!-- Password -->
            <div>
              <label for="loginPassword" class="block text-sm text-gray-700 mb-2">
                Enter your password *
              </label>
              <input
                id="loginPassword"
                name="loginPassword"
                type="password"
                [(ngModel)]="password"
                class="w-full bg-transparent border-0 border-b border-gray-500 focus:outline-none focus:border-black pb-2 text-base"
              />
            </div>

            <!-- Terms -->
            <div class="flex items-start gap-3 text-xs text-gray-600 leading-relaxed">
              <input
                id="loginTermsCheckbox"
                type="checkbox"
                class="mt-1 h-4 w-4 rounded border-gray-400"
                [checked]="termsAccepted"
                (change)="onTermsToggle($event)"
              />
              <p>
                By selecting this box, I agree that I have read, understood and agree
                to be bound by the Terms of Service, Privacy Policy, and acceptable use policy.
              </p>
            </div>

            <!-- Bottom actions -->
            <div class="pt-4 flex items-center justify-between gap-4">
              <a
                routerLink="/signup"
                class="text-sm text-gray-700 underline underline-offset-4 hover:text-black"
              >
                Create an account
              </a>

              <button
                id="login-submit-btn"
                type="submit"
                [disabled]="isSubmitting"
                class="w-12 h-12 bg-[#163d3b] text-white text-xl flex items-center justify-center hover:bg-black transition"
              >
                {{ isSubmitting ? '...' : '→' }}
              </button>
            </div>
          </form>
        </div>

        <div class="pt-10 text-xs text-gray-500">
          {{ systemFooterText }}
        </div>
      </div>
    </div>
  </div>
</div>
